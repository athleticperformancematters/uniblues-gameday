<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>Game Day — Uni Blues</title>
<style>
  :root{
    --bg:#0c2340; --panel:#123157; --panel2:#17396a; --line:#2a4a78;
    --ink:#f4f8fd; --dim:#a8bdda;
    --field:#15325a; --field2:#1b4078;
    --green:#37c46a; --amber:#f0b429; --red:#c0392b;
    --gold:#ecc24e;
    --L-FWD:#37c46a; --L-DEF:#c0392b; --L-MID:#f2cf3a; --L-WING:#36c0e6; --L-RUCK:#b06fd8;
    --mono:ui-monospace,"SFMono-Regular","DejaVu Sans Mono",monospace;
  }
  @keyframes pulseRed{0%,100%{box-shadow:0 0 0 0 rgba(192,57,43,.55)}50%{box-shadow:0 0 0 4px rgba(192,57,43,0)}}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{font-size:clamp(11px, 1.7vh, 15px)}
  body{background:var(--bg); color:var(--ink); height:100vh; overflow:hidden;
    font-family:"DejaVu Sans","Segoe UI",system-ui,sans-serif; line-height:1.35;
    display:flex; flex-direction:column; padding:8px; gap:8px;}

  /* ---------- TOP BAR ---------- */
  .topbar{display:flex; align-items:center; gap:10px; flex-shrink:0;
    background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:5px 12px;}
  .tb-left{display:flex; align-items:center; gap:8px; flex:1; min-width:0}
  .tb-right{display:flex; align-items:center; gap:8px; flex:1; min-width:0; justify-content:flex-end}
  .clockbox{display:flex; align-items:baseline; gap:.45rem; font-family:var(--mono); flex:0 0 auto}
  .clockbox .qtr{color:var(--gold); font-weight:800; font-size:1rem}
  .clockbox .clk{font-size:1.7rem; font-weight:800; min-width:5rem; text-align:center}
  .clockbox .clk.over{color:var(--amber)}
  .clockbox .clk.brk{color:var(--gold); font-size:1.1rem; letter-spacing:.1em}
  .startend{display:flex; gap:5px}
  .startend button{font-size:.82rem; padding:.5rem .9rem}
  .speedcycle{font-family:var(--mono); font-weight:800; font-size:.85rem; min-width:3.4rem;
    background:var(--gold); color:#1a1306; border-color:var(--gold); padding:.5rem .6rem; text-align:center}
  .rotpanel{display:flex; align-items:center; gap:10px; padding:3px 10px;
    background:var(--panel2); border:1px solid var(--line); border-radius:9px}
  .rotpanel .big{font-family:var(--mono); font-weight:800; font-size:1.5rem; color:var(--gold); line-height:1}
  .rotpanel .lab{font-size:.52rem; text-transform:uppercase; letter-spacing:.08em; color:var(--dim)}
  .rotpanel .qtrrot{font-family:var(--mono); font-weight:700; font-size:.95rem; color:var(--ink)}
  .iconbtn{font-size:.72rem; padding:.5rem .7rem; white-space:nowrap}
  button{font:inherit; font-size:.84rem; font-weight:700; cursor:pointer;
    border:1px solid var(--line); border-radius:7px; padding:.55rem .95rem; background:var(--panel2); color:var(--ink);}
  button:active{transform:scale(.97)}
  button:disabled{opacity:.32}
  .btn-go{background:var(--gold); color:#1a1306; border-color:var(--gold)}
  .btn-red{background:var(--red); color:#fff; border-color:var(--red)}
  .btn-warn{background:transparent; color:#e0a83a; border-color:#7a5a1e}
  .btn-warn:hover{background:#e0a83a; color:#1a1306; border-color:#e0a83a}

  /* ---------- BOARD: 4 columns — forwards · ruck-wing/mids · backs · interchange ---------- */
  .board{flex:1; min-height:0; display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:8px}
  .boardcol{background:var(--panel); border:1px solid var(--line); border-radius:10px;
    display:flex; flex-direction:column; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:6px 6px 10px}
  .colhead{font-size:.72rem; text-transform:uppercase; letter-spacing:.12em; color:var(--gold);
    font-weight:800; padding:2px 4px 6px; flex-shrink:0}
  .sublabel{font-size:.6rem; text-transform:uppercase; letter-spacing:.1em; color:var(--dim);
    font-weight:700; padding:2px 4px 4px; flex-shrink:0}
  .stack{display:flex; flex-direction:column; gap:6px}
  .sep{height:0; border-top:1px dashed var(--line); margin:9px 2px 3px}
  @media (orientation:portrait){
    body{overflow:auto; height:auto}
    .board{grid-template-columns:1fr 1fr; height:auto}
    .boardcol{overflow:visible}
  }

  .hintbar{flex-shrink:0; font-size:.72rem; color:var(--dim); padding:5px 4px 0; text-align:center; min-height:1.2rem}
  .hintbar b{color:var(--gold)}

  /* ---------- CARDS ---------- */
  .card{background:#f4f7fb; color:#10151f; border-radius:9px; overflow:hidden; cursor:pointer; min-height:80px;
    display:flex; flex-direction:column; touch-action:manipulation; -webkit-tap-highlight-color:transparent;
    border:1px solid rgba(0,0,0,.3); box-shadow:0 2px 6px rgba(0,0,0,.45)}
  .card > *{pointer-events:none}
  .card:active{transform:scale(.97)}
  .card.sel{outline:3px solid var(--gold); outline-offset:2px}
  .card.injuring{outline:3px solid var(--red); outline-offset:2px; animation:pulseRed 1s ease-in-out infinite}
  /* NAME — full-width header, coloured by position line, for maximum legibility */
  .cname{font-weight:800; font-size:1.05rem; letter-spacing:.02em; white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; padding:3px 9px; flex-shrink:0; color:#fff; background:#5a6470; line-height:1.25}
  .card.L-FWD .cname{background:#1f9d57} .card.L-DEF .cname{background:#c0392b}
  .card.L-MID .cname{background:#c99500; color:#1a1306} .card.L-WING .cname{background:#1f86b8}
  .card.L-RUCK .cname{background:#8e44c8}
  /* body: big since-rotation time (LEFT) · quarter & game shells (RIGHT) */
  .cbody{display:flex; flex:1 1 auto; min-height:0}
  .cprimary{flex:0 0 41%; display:flex; align-items:center; justify-content:center; padding:2px; background:#e7eef6; color:#1b2a3a}
  .ctval{font-family:var(--mono); font-weight:800; font-size:2rem; line-height:1; letter-spacing:.01em}
  /* RIGHT: two shells — total time + rotations, this quarter | this game */
  .cright{flex:1 1 0; display:flex; min-width:0}
  .shell{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:2px; min-width:0; background:#eef2f8}
  .slab{font-family:var(--mono); font-size:.58rem; font-weight:800; letter-spacing:.06em; color:#5a6a7d}
  .stime{font-family:var(--mono); font-weight:800; font-size:1.45rem; line-height:1; color:#101821}
  .srot{font-family:var(--mono); font-weight:800; font-size:1.1rem; line-height:1; color:#243244}
  /* bench cards: resting tint; name keeps its position colour */
  .card.b{background:#eef3f9}
  .card.b .cprimary{background:#e2ebf7; color:#244a72}
  .card.b .shell{background:#e8eef6}
  /* injured shelf — under the interchange; timers paused while here */
  .injhead{margin-top:10px; padding:5px 6px; border:1px dashed var(--line); border-radius:7px; flex-shrink:0;
    font-size:.58rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--dim);
    text-align:center; cursor:pointer; background:rgba(192,57,43,.07)}
  .injhead:active{transform:scale(.98)}
  .injstack{margin-top:6px}
  .card.inj{opacity:.62; filter:grayscale(.5)}
  .card.inj .cname{background:#6b7480; color:#fff} .card.inj .cprimary{background:#3b4048; color:#e8bdb7}
  /* game totals table — under the injured shelf */
  .gtotals{margin-top:12px; border-top:2px solid var(--line); padding-top:8px; flex-shrink:0; display:flex; flex-direction:column; min-height:0}
  .gthead{font-size:.78rem; font-weight:800; text-transform:uppercase; letter-spacing:.08em; color:var(--gold); padding:0 6px 6px; flex-shrink:0}
  .gtbody{max-height:300px; overflow-y:auto; -webkit-overflow-scrolling:touch;
    border:1px solid var(--line); border-radius:7px; background:rgba(0,0,0,.15)}
  .gtrow{display:grid; grid-template-columns:minmax(0,1fr) 3rem 2.5rem; align-items:center; font-family:var(--mono)}
  .gtrow > span{padding:5px 4px}
  .gtbody .gtrow{border-bottom:1px solid rgba(255,255,255,.08)}
  .gtbody .gtrow:last-child{border-bottom:none}
  .gtbody .gtrow:nth-child(odd){background:rgba(255,255,255,.045)}
  .gtbody .gtrow:nth-child(even){background:rgba(255,255,255,.11)}
  .gthrow{position:sticky; top:0; z-index:1; background:var(--panel2); border-bottom:2px solid var(--gold)}
  .gthrow > span{color:var(--gold); font-weight:800; font-size:.62rem; text-transform:uppercase; letter-spacing:.04em; cursor:pointer; user-select:none}
  .gthrow > span:active{opacity:.6}
  .gtn{color:var(--ink); font-weight:700; font-size:.94rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-left:8px}
  .gtm{color:var(--ink); font-weight:800; font-size:1.1rem; text-align:center; border-left:1px solid rgba(255,255,255,.12)}
  .gtr{color:var(--gold); font-weight:800; font-size:1.1rem; text-align:center; border-left:1px solid rgba(255,255,255,.12)}
  .gthrow .gtm,.gthrow .gtr,.gthrow .gtn{border-left-color:transparent}
  /* club crest in the top bar */
  .logo{height:36px; width:auto; flex:0 0 auto; border-radius:4px; display:block}

  /* ---------- EXPORT MODAL ---------- */
  .modal-bg{position:fixed; inset:0; background:rgba(6,9,14,.72); display:none; align-items:center; justify-content:center; z-index:60; padding:18px}
  .modal-bg.show{display:flex}
  .modal{background:var(--panel); border:1px solid var(--line); border-top:4px solid var(--gold); border-radius:12px; padding:22px; max-width:620px; width:100%; max-height:88vh; overflow-y:auto}
  .modal h3{font-size:1.05rem; margin-bottom:.5rem}
  .modal p{font-size:.8rem; color:var(--dim); margin-bottom:.4rem}
  .modal textarea{width:100%; height:300px; background:#0b0f17; color:var(--ink); border:1px solid var(--line); border-radius:6px; font-family:var(--mono); font-size:.66rem; padding:8px; margin:.6rem 0}
  .modal .row{display:flex; gap:8px}
</style>
</head>
<body>
<div class="topbar">
  <div class="tb-left">
    <img class="logo" src="logo.png" alt="Uni Blues" onerror="this.style.display='none'">
    <div class="startend">
      <button class="btn-go" id="primaryBtn" onclick="primary()">Start</button>
      <button class="btn-red" id="endBtn" onclick="endQuarter()">End quarter</button>
      <button class="btn-warn" onclick="resetGame()">Reset</button>
    </div>
  </div>
  <div class="clockbox"><span class="qtr" id="qtr">Q1</span><span class="clk" id="clk">00:00</span></div>
  <div class="tb-right">
    <div class="rotpanel">
      <div><div class="big" id="rotTot">0</div><div class="lab">rotations</div></div>
      <div><div class="qtrrot" id="rotQtr">Q1: 0</div><div class="lab">this qtr</div></div>
    </div>
    <button class="iconbtn" title="Export CSV" onclick="openExport()">⬇ CSV</button>
    <button class="iconbtn" title="Upload team" onclick="document.getElementById('csvInput').click()">⬆ Team</button>
    <input type="file" id="csvInput" accept=".csv,text/csv" style="display:none">
  </div>
</div>

<div class="board" id="board"></div>
<div class="hintbar" id="hint"></div>

<div class="modal-bg" id="confirmBg">
  <div class="modal" style="max-width:420px; text-align:center">
    <h3 id="confirmTitle">End quarter?</h3>
    <p id="confirmMsg" style="margin-bottom:1rem; white-space:pre-line"></p>
    <div class="row" style="justify-content:center">
      <button class="btn-red" id="confirmYes">Yes, end quarter</button>
      <button id="confirmNo">Cancel</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="exportBg">
  <div class="modal">
    <h3>Game export · CSV</h3>
    <p>Three tables: ledger  (quarter + game), rotation events (on/off times), and the log. Paste into Sheets/Excel.</p>
    <textarea id="exportText" readonly></textarea>
    <div class="row"><button class="btn-go" onclick="copyExport()">Copy</button><button onclick="closeExport()">Close</button></div>
  </div>
</div>

<script>
const LINE_OF={FB:'DEF',HB:'DEF',M:'MID',W:'WING',Ruckman:'RUCK',HF:'FWD',FF:'FWD',
  B:'DEF',C:'MID',R:'MID',F:'FWD'};
const LINECLASS={FWD:'L-FWD',DEF:'L-DEF',WING:'L-WING',RUCK:'L-RUCK',MID:'L-MID'};
const LINE_DEFAULT_POS={BACK:'HB', FWD:'HF'};
const POS_ALIAS={B:'FB',C:'M',R:'M',F:'FF'};
const nf=code=>POS_ALIAS[code]||code;
const LINE_RANK={DEF:0,RUCK:1,MID:2,WING:3,FWD:4};
const QLEN=20;
const STORAGE_KEY='gdm_autosave_v1';
const BACKUP_KEY='gdm_autosave_backup';
let lastSaveSec=-999;
function saveState(){
  const payload=JSON.stringify({savedAt:Date.now(), G});
  try{
    // roll the previous save into the backup slot before overwriting
    const prev=localStorage.getItem(STORAGE_KEY);
    if(prev) localStorage.setItem(BACKUP_KEY, prev);
    localStorage.setItem(STORAGE_KEY, payload);
  }
  catch(e){ /* storage unavailable or full — fail silently, export remains the backstop */ }
}
// Only clears the primary slot. The backup survives so a mis-tap can't destroy the only copy.
function clearSavedState(){ try{ localStorage.removeItem(STORAGE_KEY); }catch(e){} }
function hasAnySave(){
  try{ return !!(localStorage.getItem(STORAGE_KEY)||localStorage.getItem(BACKUP_KEY)); }catch(e){ return false; }
}

const CSV_TEXT=`Player Name,Playing,Interchange,Primary,Second Role,Build,Rotation Time
AKOCH,Y,N,W,HB,Medium,20
CLATWORTHY,N,N,Ruckman,FF,Key,20
CONWAY,Y,N,FB,HB,Key,25
COTTER,N,N,FF,HF,Small,25
CURRAN,Y,N,HF,W,Medium,15
DURYEA,Y,N,HB,HF,Medium,15
EBERT,N,N,HB,W,Medium,15
FURPHY_B,Y,N,W,HB,Medium,20
FURPHY_C,Y,N,HF,W,Medium,20
FURPHY_J,N,N,Ruckman,FF,Key,20
GLEESON,Y,N,M,W,Medium,15
GODDARD,Y,N,M,HF,Medium,15
GRIMLEY,Y,N,FF,Ruckman,Key,20
HAYES,Y,Y,HF,M,Small,20
HAYTER,Y,Y,M,HF,Medium,15
HEINE,Y,Y,FF,HF,Medium,20
HILL,Y,Y,FB,HB,Key,20
INGRAM,Y,N,Ruckman,FF,Key,20
IRVING,Y,N,M,W,Small,15
LACAVA,Y,N,HB,FB,Medium,20
LORD,N,N,HB,M,Small,20
LLOYD,Y,N,FB,HB,Key,25
O'BRIEN,Y,N,FB,HB,Key,20
O'SULLIVAN,N,N,HB,FB,Key,20
O'SHEA,Y,N,FB,HB,Key,20
SINNOTT,Y,N,FF,HF,Medium,20
STEWART,Y,N,FF,HF,Key,25
TOWNSON,Y,N,FF,HF,Medium,20`;

// Position vocabulary: B/F/M/W/Ruckman/HF/FF/FB/HB, with an optional "KEY " prefix
// (KEY B / KEY F) meaning a key-position player \u2014 the app's own way of flagging keys.
function normPos(raw){
  let s=(raw||'').trim().toUpperCase(); let key=false;
  if(s.startsWith('KEY')){ key=true; s=s.replace(/^KEY[\s-]*/,''); }
  const map={B:'FB', F:'FF', M:'M', W:'W', RUCKMAN:'Ruckman', C:'M', R:'M',
             FB:'FB', HB:'HB', HF:'HF', FF:'FF'};
  return {pos: map[s] || (s?nf(s):'M'), key};
}
function parseCSV(text){
  const lines=text.replace(/^\uFEFF/,'').trim().split(/\r?\n/);
  const head=lines[0].split(',').map(h=>h.trim());
  return lines.slice(1).map(l=>{
    const c=l.split(','); const o={}; head.forEach((h,i)=>o[h]=(c[i]||'').trim());
    const {pos,key}=normPos(o['Primary']);
    // rotation minutes: a labelled column if present, else the last positive number in the row
    let rot=o['Rotation Time']??o['Rotation Time (min)']??o['Minutes']??'';
    if(rot===''){ const nums=c.map(x=>parseFloat((x||'').trim())).filter(v=>isFinite(v)&&v>0); rot=nums.length?nums[nums.length-1]:''; }
    const rv=parseFloat(rot);
    return {n:o['Player Name'], playing:o['Playing']==='Y', ic:o['Interchange']==='Y',
      pos, flex:(o['Second Role']?o['Second Role'].split('/').map(s=>normPos(s).pos):[]),
      build:key?'Key':(o['Build']||'Medium'),
      rotMin:(isFinite(rv)&&rv>0)?rv:null};
  }).filter(p=>p.playing && p.n);
}
let SQUAD=parseCSV(CSV_TEXT);

let G, timer=null, cardEls={}, totalEls={}, lastSec=-1;
let totSort={key:'name', dir:'asc'};   // game-totals table sort — UI-only, not saved/exported
function setTotSort(key){
  if(totSort.key===key){ totSort.dir = totSort.dir==='asc'?'desc':'asc'; }
  else{ totSort={key, dir: key==='name'?'asc':'desc'}; }   // numeric columns default highest-first
  buildField();
}
function sortedTotals(){
  const {key,dir}=totSort, mul=dir==='asc'?1:-1;
  return P().slice().sort((a,b)=>{
    const v = key==='name' ? a.n.localeCompare(b.n) : key==='min' ? a.onSecG-b.onSecG : a.rotG-b.rotG;
    return v*mul;
  });
}
function init(){
  G={qtr:1, sec:0, running:false, speed:1, phase:'live',
     rotTot:0, qRot:{1:0,2:0,3:0,4:0}, sel:null, injuring:null, log:[], events:[], players:{},
     qtimes:{1:{},2:{},3:{},4:{}}};
  let si=0;
  SQUAD.forEach(p=>{
    G.players[p.n]={...p, curPos:p.pos, loc:p.ic?'bench':'on', slot:si++,
      stintSec:0, onSecQ:0, restSecQ:0, rotQ:0, onSecG:0, restSecG:0, rotG:0,
      qField:{1:0,2:0,3:0,4:0}, qRot:{1:0,2:0,3:0,4:0}};
  });
  logLine('brk', `Q1 · ${onF().length} on, bench: ${bn().map(p=>p.n).join(', ')}. Press Start.`);
  const clk=document.getElementById('clk'); if(clk){ clk.textContent=mmss(0); clk.className='clk'; }
  buildField(); paintAll(); renderLog(); renderControls();
}
const P=()=>Object.values(G.players);
const onF=()=>P().filter(p=>p.loc==='on');
const bn=()=>P().filter(p=>p.loc==='bench');
const inj=()=>P().filter(p=>p.loc==='injured');
function benchSorted(){ return bn().slice().sort((a,b)=>{
  const la=(LINE_RANK[LINE_OF[a.pos]]??9), lb=(LINE_RANK[LINE_OF[b.pos]]??9);
  if(la!==lb) return la-lb;
  return a.stintSec-b.stintSec;   // longest on bench sinks to the bottom within a line
}); }

/* ---------- CLOCK ---------- */
function primary(){
  if(G.phase==='break'){ startQuarter(); return; }
  if(G.phase==='full') return;
  G.running=!G.running;
  if(G.running){ if(!G.qtimes[G.qtr].start) G.qtimes[G.qtr].start=Date.now(); startTimer(); }
  else stopTimer();
  renderControls(); saveState();
}
function startTimer(){ stopTimer(); let last=Date.now();
  timer=setInterval(()=>{ const now=Date.now(); const d=(now-last)/1000*G.speed; last=now; advance(d); },250); }
function stopTimer(){ if(timer){clearInterval(timer); timer=null;} }
function advance(dSec){
  if(dSec<=0) return; G.sec+=dSec;
  onF().forEach(p=>{p.stintSec+=dSec; p.onSecQ+=dSec; p.onSecG+=dSec; p.qField[G.qtr]=(p.qField[G.qtr]||0)+dSec;});
  bn().forEach(p=>{p.stintSec+=dSec; p.restSecQ+=dSec; p.restSecG+=dSec;});
  tickLive();
  if(G.sec-lastSaveSec>=5){ saveState(); lastSaveSec=G.sec; }
}
function askConfirm(title, msg, yesLabel, onYes, opts){
  opts=opts||{};
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmMsg').textContent = msg;
  const yes=document.getElementById('confirmYes');
  yes.textContent = yesLabel;
  yes.onclick=()=>{ closeConfirm(); onYes(); };
  const no=document.getElementById('confirmNo');
  no.textContent = opts.noLabel || 'Cancel';
  no.onclick=()=>{ closeConfirm(); if(opts.onNo) opts.onNo(); };
  document.getElementById('confirmBg').classList.add('show');
}
function endQuarter(){
  if(G.phase!=='live') return;
  const final=G.qtr>=4;
  askConfirm(
    final?'Final siren?':('End Q'+G.qtr+'?'),
    final?'This ends the game. Stint clocks reset.':'Everyone is marked rested for the break. Stint clocks reset.',
    final?'Sound final siren':'Yes, end quarter',
    doEndQuarter
  );
}
function closeConfirm(){ document.getElementById('confirmBg').classList.remove('show'); }
// tab-separated export -> proper CSV (quote any field holding a comma/quote/newline)
function tsvToCsv(text){
  const esc=c=>/[",\n]/.test(c) ? '"'+c.replace(/"/g,'""')+'"' : c;
  return text.split('\n').map(line=>line.split('\t').map(esc).join(',')).join('\n');
}
function autoBackupFile(label){
  try{
    const txt=tsvToCsv(buildExportText());
    const d=new Date();
    const stamp=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}_${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}`;
    const blob=new Blob([txt],{type:'text/csv'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`UniBlues_${label}_${stamp}.csv`;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }catch(e){ /* download blocked — autosave + manual export remain */ }
}
function doEndQuarter(){
  const final=G.qtr>=4;
  G.qtimes[G.qtr].end=Date.now();
  const label=final?'FullTime':('EndQ'+G.qtr);
  G.running=false; stopTimer(); P().forEach(p=>{p.stintSec=0;});
  if(final){ G.phase='full'; logLine('brk', `Full time · ${mmss(G.sec)} · ${G.rotTot} rotations total.`); }
  else{ G.phase='break'; logLine('brk', `— end Q${G.qtr} (${mmss(G.sec)}) · break · stint clocks reset —`); }
  paintAll(); renderLog(); renderControls(); saveState();
  autoBackupFile(label);
}
function startQuarter(){
  G.qtr++; G.sec=0; G.phase='live';
  G.qtimes[G.qtr].start=Date.now();
  P().forEach(p=>{p.onSecQ=0; p.restSecQ=0; p.rotQ=0; p.stintSec=0;});
  logLine('brk', `— Q${G.qtr} start —`);
  G.running=true; startTimer(); paintAll(); renderLog(); renderControls(); saveState();
}

/* ---------- SWAP PROCESS ----------
   Tap one player to select. Tap a second:
     on + bench  -> ROTATION (bench on for field player; both stints reset; +1 rot each)
     on + on     -> POSITION SWAP (exchange positions; stints keep running)
     bench+bench -> selection moves to the new one
   Tap the selected player again to cancel. Selection is a class toggle only. */
function clickCard(name){
  const p=G.players[name];
  if(G.injuring){                                 // an on-field injury is waiting for its replacement
    const x=G.players[G.injuring];
    if(name===G.injuring){ cancelInjury(); return; }
    if(p.loc==='bench'){ completeInjury(x,p); return; }
    flashHint('Tap an interchange player to come on for '+x.n+', or tap '+x.n+' to cancel.'); return;
  }
  if(p.loc==='injured'){ recover(p); return; }   // tap an injured card to return them to the bench
  if(!G.sel){ setSel(name); return; }
  if(G.sel===name){ setSel(null); return; }
  const a=G.players[G.sel], b=p;
  if(a.loc==='on' && b.loc==='on'){ swapPositions(a,b); setSel(null); buildField(); paintAll(); renderLog(); saveState(); return; }
  if(a.loc!==b.loc){ const on=a.loc==='on'?a:b, bench=a.loc==='on'?b:a; rotate(on,bench); setSel(null); buildField(); paintAll(); renderLog(); renderControls(); saveState(); return; }
  setSel(name);
}
function setSel(name){ G.sel=name;
  Object.keys(cardEls).forEach(n=>cardEls[n].root.classList.toggle('sel', n===name)); renderHint(); }
function rotate(onP, benchP){
  const vac=onP.curPos; let note='';
  if(vac==='Ruckman' && !['FB','FF'].includes(benchP.pos)) note=' ⚠ ruck cover not FF/FB';
  const t=onP.rotMin; const ratio=t?onP.stintSec/60/t:0; const late=ratio>=1;
  onP.loc='bench'; onP.stintSec=0; onP.rotQ++; onP.rotG++; onP.qRot[G.qtr]=(onP.qRot[G.qtr]||0)+1;
  G.events.push({player:onP.n, q:G.qtr, sec:G.sec, wall:Date.now(), dir:"OFF", pos:vac});
  benchP.loc='on'; benchP.curPos=vac; benchP.stintSec=0;
  G.events.push({player:benchP.n, q:G.qtr, sec:G.sec, wall:Date.now(), dir:"ON", pos:vac});
  G.rotTot++; G.qRot[G.qtr]++;
  setRotCounter();                       // live top-of-screen update
  logLine(late?'late':'rest', `<span class="t">Q${G.qtr} ${mmss(G.sec)}</span> · ${onP.n} OFF (${vac}${late?', LATE '+ratio.toFixed(2):''}) · ${benchP.n} ON${note}`);
}
function swapPositions(a,b){
  const pa=a.curPos, pb=b.curPos; a.curPos=pb; b.curPos=pa;
  const sa=a.slot, sb=b.slot; a.slot=sb; b.slot=sa;
  logLine('move', `<span class="t">Q${G.qtr} ${mmss(G.sec)}</span> · ${a.n} ↔ ${b.n} (${pa}↔${pb})`);
}
function logLine(cls, txt){ G.log.unshift({cls,txt}); }
function flashHint(msg){ const h=document.getElementById('hint'); if(h){ h.innerHTML='<b>'+msg+'</b>'; } }
/* ---------- INJURED SHELF (timers paused; excluded from advance) ----------
   On-field injuries must keep 18 on the pitch, so they pair with a replacement:
   select the hurt player → tap the Injured bar → tap the interchange sub coming on.
   Bench injuries need no replacement and simply shrink the interchange. */
function injureSelected(){
  if(G.injuring){ cancelInjury(); return; }               // second tap on the bar cancels
  if(!G.sel){ flashHint('Select a player first, then tap the Injured bar to sideline them.'); return; }
  const p=G.players[G.sel];
  if(p.loc==='injured'){ setSel(null); return; }
  if(p.loc==='bench'){                                     // no replacement needed
    p.loc='injured';
    logLine('brk', `<span class="t">Q${G.qtr} ${mmss(G.sec)}</span> · ${p.n} sidelined (injured, from bench) — timers paused`);
    setSel(null); buildField(); paintAll(); renderControls(); saveState(); return;
  }
  // on-field: arm the injury and wait for the sub coming on so 18 is maintained
  G.injuring=p.n; setSel(null); buildField(); paintAll(); renderControls();
  flashHint(p.n+' injured — tap the interchange player coming on to keep 18 on the pitch. Tap '+p.n+' or the Injured bar to cancel.');
  saveState();
}
function completeInjury(x, y){
  const pos=x.curPos;
  x.loc='injured';                                         // timers freeze
  G.events.push({player:x.n, q:G.qtr, sec:G.sec, wall:Date.now(), dir:"OFF", pos});
  y.loc='on'; y.curPos=pos; y.stintSec=0;                  // sub takes the vacated position
  G.events.push({player:y.n, q:G.qtr, sec:G.sec, wall:Date.now(), dir:"ON", pos});
  G.injuring=null;
  logLine('brk', `<span class="t">Q${G.qtr} ${mmss(G.sec)}</span> · ${x.n} injured off (${pos}) · ${y.n} on — 18 maintained`);
  setSel(null); buildField(); paintAll(); renderControls(); saveState();
}
function cancelInjury(){ G.injuring=null; buildField(); paintAll(); renderControls(); flashHint('Injury cancelled.'); saveState(); }
function recover(p){
  p.loc='bench'; p.stintSec=0;   // back to the interchange, stint clock restarts
  logLine('rest', `<span class="t">Q${G.qtr} ${mmss(G.sec)}</span> · ${p.n} recovered → interchange (clock reset)`);
  setSel(null); buildField(); paintAll(); renderControls(); saveState();
}

/* ---------- HELPERS ---------- */
function mmss(sec){const s=Math.floor(sec); return String(Math.floor(s / 60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function mins(sec){return Math.round(sec/60);}
function pctQ(p){ const e=Math.max(G.sec,1); return Math.min(100,Math.round(p.onSecQ/e*100)); }
function lineCls(pos){return LINECLASS[LINE_OF[pos]||'MID'];}
function buildCls(b){ b=(b||'Medium').toLowerCase(); return b==='key'?'bd-key':(b==='small'?'bd-small':'bd-med'); }
function buildLetter(b){ b=(b||'Medium').toLowerCase(); return b==='key'?'K':(b==='small'?'S':'M'); }

/* ---------- STRUCTURE  (rebuilt on roster/rotation change) ---------- */
const isKey=p=>(p.build||'').toLowerCase()==='key';
function makeCard(p,where){
  // card colour = line of current position on field; line of STARTING position off it
  const line=lineCls(where==='field'?p.curPos:p.pos);
  const kind=where==='bench'?'b ':(where==='injured'?'b inj ':'');
  const root=document.createElement('div');
  root.className=('card '+kind+line+(G.sel===p.n?' sel':'')+(G.injuring===p.n?' injuring':'')).trim();
  root.innerHTML=
    `<div class="cname">${p.n}</div>`+
    `<div class="cbody">`+
      `<div class="cprimary"><span class="ctval"></span></div>`+
      `<div class="cright">`+
        `<div class="shell shq"><span class="slab">QTR</span><span class="stime qrot"></span><span class="srot qtime"></span></div>`+
      `</div>`+
    `</div>`;
  root.onclick=()=>clickCard(p.n);
  cardEls[p.n]={root, tval:root.querySelector('.ctval'),
    qtime:root.querySelector('.qtime'), qrot:root.querySelector('.qrot')};
  paintCard(p,where);
  return root;
}
function fieldColumns(){
  const f=onF();
  const at=(...ps)=>f.filter(p=>ps.includes(p.curPos));
  // longest since-last-rotation sinks to the bottom of each sub-list
  const srt=arr=>arr.slice().sort((a,b)=>b.stintSec-a.stintSec);  // longest on-field rises to the top
  const fwd=at('HF','FF'), back=at('FB','HB');
  return {
    fwdKey:  srt(fwd.filter(isKey)),
    fwdOther:srt(fwd.filter(p=>!isKey(p))),
    ruckWing:[...srt(at('Ruckman')), ...srt(at('W'))],  // ruck pinned to top, wings sorted below
    mids:    srt(at('M')),
    backKey: srt(back.filter(isKey)),
    backOther:srt(back.filter(p=>!isKey(p)))
  };
}
function makeColumn(head, sections){
  const col=document.createElement('div'); col.className='boardcol';
  const h=document.createElement('div'); h.className='colhead'; h.textContent=head; col.appendChild(h);
  sections.forEach((s,i)=>{
    if(i>0){ const sep=document.createElement('div'); sep.className='sep'; col.appendChild(sep); }
    const lab=document.createElement('div'); lab.className='sublabel'; lab.textContent=s.label; col.appendChild(lab);
    const stack=document.createElement('div'); stack.className='stack';
    s.cards.forEach(p=>stack.appendChild(makeCard(p,'field')));
    col.appendChild(stack);
  });
  return col;
}
// per-column game totals — every player currently tagged to this column (by curPos, so it
// follows a player if they get swapped into a different line mid-game), in the shared sort
// order (tap any table's header to sort all three by name/min/rotations)
function makeTotalsTable(id, players){
  const gt=document.createElement('div'); gt.className='gtotals';
  const gth=document.createElement('div'); gth.className='gthead'; gth.textContent='Game totals'; gt.appendChild(gth);
  const body=document.createElement('div'); body.className='gtbody'; body.id=id;
  const arrow=k=>totSort.key===k?(totSort.dir==='asc'?' ▲':' ▼'):'';
  const hdrow=document.createElement('div'); hdrow.className='gtrow gthrow';
  hdrow.innerHTML=`<span class="gtn" data-k="name">Player${arrow('name')}</span><span class="gtm" data-k="min">Min${arrow('min')}</span><span class="gtr" data-k="rot">↻${arrow('rot')}</span>`;
  hdrow.querySelectorAll('[data-k]').forEach(el=>{ el.onclick=()=>setTotSort(el.dataset.k); });
  body.appendChild(hdrow);
  players.forEach(p=>{
    const row=document.createElement('div'); row.className='gtrow';
    row.innerHTML=`<span class="gtn">${p.n}</span><span class="gtm"></span><span class="gtr"></span>`;
    totalEls[p.n]={m:row.querySelector('.gtm'), r:row.querySelector('.gtr')};
    body.appendChild(row);
  });
  gt.appendChild(body);
  return gt;
}
function buildField(){
  // keep each column's totals-table scroll position across rebuilds
  const totIds=['gtbody-fwd','gtbody-mid','gtbody-back'];
  const prevTotScroll={};
  totIds.forEach(id=>{ prevTotScroll[id]=(document.getElementById(id)||{}).scrollTop||0; });
  cardEls={}; totalEls={};
  const c=fieldColumns();
  const board=document.getElementById('board'); board.innerHTML='';

  const totSorted=sortedTotals();
  const byCol=(...ps)=>totSorted.filter(p=>ps.includes(p.curPos));

  const fwdCol=makeColumn('Forwards', [
    {label:'Forwards', cards:c.fwdOther}, {label:'Key', cards:c.fwdKey}]);
  fwdCol.appendChild(makeTotalsTable('gtbody-fwd', byCol('HF','FF')));
  board.appendChild(fwdCol);

  const midCol=makeColumn('Mids / Ruck · Wing', [
    {label:'Mids', cards:c.mids}, {label:'Ruck · Wing', cards:c.ruckWing}]);
  midCol.appendChild(makeTotalsTable('gtbody-mid', byCol('M','Ruckman','W')));
  board.appendChild(midCol);

  const backCol=makeColumn('Backs', [
    {label:'Backs', cards:c.backOther}, {label:'Key', cards:c.backKey}]);
  backCol.appendChild(makeTotalsTable('gtbody-back', byCol('FB','HB')));
  board.appendChild(backCol);

  const ic=document.createElement('div'); ic.className='boardcol';
  const ih=document.createElement('div'); ih.className='colhead'; ih.textContent='Interchange'; ic.appendChild(ih);
  const stack=document.createElement('div'); stack.className='stack';
  benchSorted().forEach(p=>stack.appendChild(makeCard(p,'bench')));
  ic.appendChild(stack);
  // injured shelf — tap the bar to sideline the selected player (timers pause)
  const injhead=document.createElement('div'); injhead.className='injhead';
  injhead.textContent='＋ Injured · tap to sideline selected — timers paused';
  injhead.onclick=injureSelected;
  ic.appendChild(injhead);
  const istack=document.createElement('div'); istack.className='stack injstack';
  inj().forEach(p=>istack.appendChild(makeCard(p,'injured')));
  ic.appendChild(istack);
  board.appendChild(ic);

  totIds.forEach(id=>{ const el=document.getElementById(id); if(el) el.scrollTop=prevTotScroll[id]; });
  paintTotals();
  renderHint();
}

/* ---------- IN-PLACE PAINT (every tick) ---------- */
function paintCard(p,where){
  const c=cardEls[p.n]; if(!c) return;
  c.tval.textContent=mmss(p.stintSec);   // since last rotation (field) / on bench / frozen (injured)
  c.qtime.textContent=mins(p.onSecQ)+'m';  c.qrot.textContent=p.rotQ+'↻';  // this quarter
}
function paintAll(){
  P().forEach(p=>paintCard(p));
  paintTotals();
}
function paintTotals(){
  P().forEach(p=>{ const t=totalEls[p.n]; if(t){ t.m.textContent=mins(p.onSecG); t.r.textContent=p.rotG; } });
}
function tickLive(){
  const clk=document.getElementById('clk');
  clk.textContent=mmss(G.sec);
  clk.className='clk'+((G.sec>=QLEN*60 && G.phase==='live')?' over':'');
  paintAll();
}

/* ---------- TOP COUNTER / CONTROLS ---------- */
function setRotCounter(){
  document.getElementById('rotTot').textContent=G.rotTot;
  document.getElementById('rotQtr').textContent='Q'+G.qtr+': '+G.qRot[G.qtr];
}
function renderControls(){
  const q=document.getElementById('qtr'), clk=document.getElementById('clk');
  if(G.phase==='full'){ q.textContent='FT'; }
  else if(G.phase==='break'){ q.textContent='Q'+G.qtr+' done'; clk.textContent='BREAK'; clk.className='clk brk'; }
  else { q.textContent='Q'+G.qtr; }
  setRotCounter();
  const pb=document.getElementById('primaryBtn'), eb=document.getElementById('endBtn');
  if(G.phase==='full'){ pb.textContent='Game over'; pb.disabled=true; eb.disabled=true; return; }
  if(G.phase==='break'){ pb.textContent='Start Q'+(G.qtr+1); pb.disabled=false; eb.disabled=true; return; }
  pb.disabled=false; eb.disabled=false;
  pb.textContent = G.running ? 'Pause' : (G.sec>0?'Resume':'Start');
  eb.textContent = G.qtr>=4 ? 'Final siren' : 'End quarter';
}
function renderHint(){
  const h=document.getElementById('hint'); if(!h) return;
  if(!G.sel){ h.innerHTML='Tap two on-field players to swap positions · tap one on-field then a bench player to rotate.'; return; }
  const p=G.players[G.sel];
  h.innerHTML = p.loc==='on'
    ? `<b>${p.n}</b> (${p.curPos}) selected — tap a bench player to rotate on, or another on-field player to swap. Tap again to cancel.`
    : `<b>${p.n}</b> selected — tap the on-field player to bring this player on for. Tap again to cancel.`;
}
function renderLog(){ const l=document.getElementById('log'); if(l) l.innerHTML=G.log.map(e=>`<div class="${e.cls}">${e.txt}</div>`).join(''); }

/* ---------- EXPORT (CSV) ---------- */
function hhmm(ts){ if(!ts) return '—'; const d=new Date(ts); return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'}); }
function secToMmss(s){ s=Math.round(s||0); const m=Math.floor(s/60),ss=s%60; return `${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`; }
function openExport(){
  document.getElementById('exportText').value=buildExportText();
  document.getElementById('exportBg').classList.add('show');
}
function buildExportText(){
  const thru = G.phase==='full'?'FULL TIME':('Q'+G.qtr+' '+mmss(G.sec));
  const now = new Date().toLocaleString('en-AU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  let out = `UNI BLUES — GAME DAY EXPORT\n`;
  out += `Through: ${thru}\tGenerated: ${now}\n`;
  out += `Total rotations:\t${G.rotTot}\tQ1:\t${G.qRot[1]}\tQ2:\t${G.qRot[2]}\tQ3:\t${G.qRot[3]}\tQ4:\t${G.qRot[4]}\n`;
  const qt=t=>(G.qtimes[t]||{});
  out += `Quarter wall times:\tQ1 ${hhmm(qt(1).start)}–${hhmm(qt(1).end)}\tQ2 ${hhmm(qt(2).start)}–${hhmm(qt(2).end)}\tQ3 ${hhmm(qt(3).start)}–${hhmm(qt(3).end)}\tQ4 ${hhmm(qt(4).start)}–${hhmm(qt(4).end)}\n`;

  // SECTION 1: Player Summary
  out += `\nSECTION 1 — PLAYER SUMMARY\n`;
  out += `Player\t#\tPosition\tBuild\tField Time\tBench Time\tRotations\tGame %\n`;
  const totalGameSec = ()=>{ let s=0; [1,2,3,4].forEach(q=>{ const t=G.qtimes[q]||{}; if(t.start&&t.end) s+=(t.end-t.start)/1000; }); return s||Math.max(G.sec*G.qtr,1); };
  P().sort((a,b)=>b.onSecG-a.onSecG).forEach(p=>{
    const pct=Math.min(100,Math.round(p.onSecG/totalGameSec()*100));
    out += `${p.n}\t\t${p.curPos}\t${p.build}\t${secToMmss(p.onSecG)}\t${secToMmss(p.restSecG)}\t${p.rotG}\t${pct}%\n`;
  });

  // SECTION 2: Quarter Load
  out += `\nSECTION 2 — QUARTER LOAD\n`;
  out += `Player\tQ1 Time\tQ1 Rot\tQ2 Time\tQ2 Rot\tQ3 Time\tQ3 Rot\tQ4 Time\tQ4 Rot\tTotal Time\tTotal Rot\n`;
  P().sort((a,b)=>b.onSecG-a.onSecG).forEach(p=>{
    out += `${p.n}\t${secToMmss(p.qField[1])}\t${p.qRot[1]||0}\t${secToMmss(p.qField[2])}\t${p.qRot[2]||0}\t${secToMmss(p.qField[3])}\t${p.qRot[3]||0}\t${secToMmss(p.qField[4])}\t${p.qRot[4]||0}\t${secToMmss(p.onSecG)}\t${p.rotG}\n`;
  });

  // SECTION 3: Rotation Events
  out += `\nSECTION 3 — ROTATION EVENTS\n`;
  out += `Quarter\tGame Time\tWall Time\tPlayer Off\tPlayer On\tPosition\n`;
  // pair OFF/ON events by matching consecutive same-time same-position events
  const evts=G.events;
  for(let i=0;i<evts.length;i++){
    const e=evts[i];
    if(e.dir==='OFF'){
      const on=evts.find((x,j)=>j>i&&x.dir==='ON'&&x.q===e.q&&x.pos===e.pos&&Math.abs(x.sec-e.sec)<1);
      out += `Q${e.q}\t${mmss(e.sec)}\t${hhmm(e.wall)}\t${e.player}\t${on?on.player:'—'}\t${e.pos}\n`;
    } else if(e.dir==='GAP'){
      out += `Q${e.q}\t${mmss(e.sec)}\t${hhmm(e.wall)}\t⚠ SESSION GAP\t${mmss(e.gapSec)} untracked\tautosave from ${hhmm(e.savedAt)}\n`;
    }
  }

  return out;
}
function closeExport(){document.getElementById('exportBg').classList.remove('show');}
function copyExport(){const t=document.getElementById('exportText'); t.select(); try{document.execCommand('copy');}catch(e){}}

/* ---------- RESET ---------- */
function resetGame(){
  if(!gameInProgress()){
    // nothing to lose — just reset silently to a clean Q1
    stopTimer(); clearSavedState(); init(); return;
  }
  askConfirm(
    'Reset game?',
    'This clears all rotations, timers, quarter progress and the log, and returns to a fresh Q1 with the same team. This cannot be undone.',
    'Yes, reset game',
    ()=>{ stopTimer(); clearSavedState(); init(); }
  );
}

/* ---------- UPLOAD NEW TEAM ---------- */
function gameInProgress(){ return !!G && (G.running || G.sec>0 || G.rotTot>0 || G.qtr>1 || G.phase==='full'); }
function loadCSV(text){
  let squad; try{ squad=parseCSV(text); }catch(e){ alert('Could not read that CSV.'); return; }
  if(!squad.length){ alert('No players found. Need a Player Name column and Playing=Y rows.'); return; }
  stopTimer(); SQUAD=squad; clearSavedState(); init();
  alert(`Loaded ${squad.length} players. New game ready — press Start.`);
}
document.getElementById('csvInput').addEventListener('change', function(ev){
  const file=ev.target.files[0]; ev.target.value=''; if(!file) return;
  const go=()=>{ const r=new FileReader(); r.onload=e=>loadCSV(e.target.result); r.onerror=()=>alert('Could not read that file.'); r.readAsText(file); };
  if(gameInProgress()){
    askConfirm('Upload new team?',
      'This ENDS the game in progress and clears all rotations, timers and the log.',
      'Yes, load new team', go);
  } else { go(); }
});

function readSave(key){
  let raw; try{ raw=localStorage.getItem(key); }catch(e){ return null; }
  if(!raw) return null;
  let saved; try{ saved=JSON.parse(raw); }catch(e){ return null; }
  if(!saved || !saved.G || !saved.G.players) return null;
  return saved;
}
function logSessionGap(savedAt){
  const gapSec=Math.max(0,(Date.now()-savedAt)/1000);
  G.events.push({q:G.qtr, sec:G.sec, wall:Date.now(), dir:'GAP', savedAt, gapSec});
  logLine('brk', `⚠ Session resumed — ${mmss(gapSec)} untracked since last autosave (${new Date(savedAt).toLocaleTimeString()})`);
  renderLog();
}
function tryRestore(){
  const saved = readSave(STORAGE_KEY) || readSave(BACKUP_KEY);
  if(!saved){ init(); return; }
  const g=saved.G;
  const when=new Date(saved.savedAt).toLocaleString();
  const desc=(g.phase==='full'?'Full time':'Q'+g.qtr+' '+mmss(g.sec))+', '+g.rotTot+' rotations logged';
  // NOTE: declining does NOT delete the save — it is kept until explicitly overwritten.
  askConfirm(
    'Resume autosaved game?',
    `${desc}, saved ${when}.\n\nThe saved game is always kept on this device either way.\n\n`+
    `⚠ "Start fresh" abandons everything tracked since that save — every rotation, all on-field time and the log for the game currently in progress will NOT appear in your next export unless you come back and resume this save later.`,
    'Resume game',
    ()=>{
      G=g; G.running=false; cardEls={};
      buildField(); paintAll(); renderLog(); renderControls();
      const clk=document.getElementById('clk');
      clk.textContent=mmss(G.sec);
      clk.className='clk'+((G.sec>=QLEN*60 && G.phase==='live')?' over':'');
      logSessionGap(saved.savedAt);
    },
    { noLabel:'Start fresh (lose autosave)', onNo:()=>{
      init();
      logLine('brk', `⚠ An autosave from ${when} (${desc}) was available but not resumed.`);
      renderLog();
    } }
  );
}
window.addEventListener('beforeunload', function(e){
  if(gameInProgress()){ e.preventDefault(); e.returnValue=''; }
});
tryRestore();
</script>
